name: RoadSecure MVP

on:
  push:
    branches: [main, feature/mvp-demo-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend and ML tests (Linux and Windows)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest tests
        working-directory: backend

  browser:
    name: Production frontend and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-browser.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install -r backend/requirements.txt -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_acceptance.py --screenshots "${{ runner.temp }}/roadsecure-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadsecure-browser-screenshots
          path: ${{ runner.temp }}/roadsecure-screenshots
          if-no-files-found: ignore
